name: petcare
description: "PetCare - Ứng dụng chăm sóc và quản lý thú cưng"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Quản lý trạng thái & Điều hướng
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0

  # Firebase SDK
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0
  firebase_storage: ^11.7.0

  # Bản đồ & Vị trí
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0

  # Thông báo & Cài đặt cục bộ
  flutter_local_notifications: ^17.1.0
  timezone: ^0.9.2
  shared_preferences: ^2.2.3

  # Xử lý hình ảnh, biểu đồ & định dạng
  image_picker: ^1.1.0
  cached_network_image: ^3.3.1
  fl_chart: ^0.67.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
